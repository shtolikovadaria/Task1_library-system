# Настройки H2 с эмуляцией MySQL
spring.datasource.url=jdbc:h2:mem:library_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Веб-консоль H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Настройки JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Порядок загрузки: сначала Hibernate создает таблицы, ПОТОМ выполняется data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always